
name: Test MEGA configuration

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration secret
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          if [ -z "$RCLONE_CONF" ]; then
            echo "ERROR: RCLONE_CONF is missing"
            exit 1
          fi
          echo "OK: RCLONE_CONF is available"
          
