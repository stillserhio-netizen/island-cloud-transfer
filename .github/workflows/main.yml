
name: Test MEGA connection

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install official rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version
          rclone help backends | grep -i mega

      - name: Configure and test MEGA
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p "$HOME/.config/rclone"
          printf '%s\n' "$RCLONE_CONF" > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          rclone lsf mega: --max-depth 1
